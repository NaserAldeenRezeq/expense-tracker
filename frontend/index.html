<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
  </head>
  <body>
    <!-- PHASE 2: build the page here.

       Your backend (Phase 1) is already running with real data in it,
       so build this page straight against the API - there is no
       in-memory or localStorage stage this time.

       1. Navbar
       2. Summary cards: total amount, number of expenses, highest expense
       3. Form to add an expense: title, amount, category (select), date
       4. Filter by category (with an "All" option)
       5. Table: title, amount, category, date, an edit button, a delete button

       Remember: the table rows must be built with JavaScript (DOM),
       not written by hand in this file. -->

    <header>
      <nav class="navbar bg-dark" data-bs-theme="dark">
        <div class="container">
          <span class="navbar-brand mb-0 h1">Expense Tracker</span>
          <button id="theme-toggle" type="button" class="btn btn-outline-light btn-sm">Dark mode</button>
        </div>
      </nav>
    </header>
    <main class="container py-4">
      <!--!-------------------------------------------------------------  -->
      <div id="alert" class="alert alert-danger d-none" role="alert"></div>
      <!--!-------------------------------------------------------------  -->
      <div id="spinner" class="text-center my-4 d-none">
        <div class="spinner-border text-primary" role="status">
          <span class="visually-hidden">Loading...</span>
        </div>
      </div>
      <!--!-------------------------------------------------------------  -->
      <div class="summary-grid mb-4">
        <div class="card h-100">
          <div class="card-body">
            <h5 class="card-title">Total</h5>
            <p id="total-amount" class="card-text fs-3 fw-bold">0</p>
          </div>
        </div>
        <div class="card h-100">
          <div class="card-body">
            <h5 class="card-title">Number of expenses</h5>
            <p id="expense-count" class="card-text fs-3 fw-bold">0</p>
          </div>
        </div>
        <div class="card h-100">
          <div class="card-body">
            <h5 class="card-title">Highest expense</h5>
            <p id="highest-expense" class="card-text fs-3 fw-bold">0</p>
          </div>
        </div>
      </div>
      <!--!-------------------------------------------------------------  -->
      <div class="card mb-4">
        <div class="card-body">
          <h5 class="card-title">Add Expense</h5>

          <form id="add-form" class="row g-3" novalidate>

            <div class="col-12 col-md-3">
              <label for="title" class="form-label">Title</label>
              <input type="text" class="form-control" id="title"
                placeholder="Lunch" maxlength="100"
                required>
              <div class="invalid-feedback"></div>
            </div>

            <div class="col-12 col-md-3">
              <label for="amount" class="form-label">Amount</label>
              <input type="number" class="form-control" id="amount"
                placeholder="4.50" step="0.01"
                min="0.01" required>
              <div class="invalid-feedback"></div>
            </div>

            <div class="col-12 col-md-3">
              <label for="category" class="form-label">Category</label>
              <select class="form-select" id="category" required>
                <option selected value>Choose...</option>
                <option value="Food">Food</option>
                <option value="Transport">Transport</option>
                <option value="Bills">Bills</option>
                <option value="Entertainment">Entertainment</option>
                <option value="Other">Other</option>
              </select>
              <div class="invalid-feedback"></div>
            </div>

            <div class="col-12 col-md-3">
              <label for="date" class="form-label">Date</label>
              <input type="date" class="form-control" id="date" required>
              <div class="invalid-feedback"></div>
            </div>

            <div class="col-12">
              <button class="btn btn-primary" type="submit">Add Expense</button>
            </div>
          </form>
        </div>
      </div>

      <!--!-------------------------------------------------------------  -->
      <div class="card">
        <div class="card-body">

          <div
            class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
            <h5 class="card-title mb-0">Expenses</h5>
            <div class="d-flex align-items-center gap-2">
              <label for="filter" class="form-label mb-0">Category</label>
              <select id="filter" class="form-select w-auto">
                <option value="all">All</option>
                <option value="Food">Food</option>
                <option value="Transport">Transport</option>
                <option value="Bills">Bills</option>
                <option value="Entertainment">Entertainment</option>
                <option value="Other">Other</option>
              </select>
            </div>
          </div>

          <div class="table-responsive">
            <table class="table table-striped table-hover align-middle mb-0">
              <thead>
                <tr>
                  <th>Title</th>
                  <th class="text-end">Amount</th>
                  <th>Category</th>
                  <th>Date</th>
                  <th class="text-end">Actions</th>
                </tr>
              </thead>
              <tbody id="expenses-body"></tbody>
            </table>
          </div>

        </div>
      </div>
    </main>
    <!--!-------------------------------------------------------------  -->
    <!--!-------------------------------------------------------------  -->

    <div class="modal fade" id="edit-modal" tabindex="-1"
      aria-labelledby="edit-modal-title" aria-hidden="true">
      <div class="modal-dialog">
        <div class="modal-content">
          <form id="edit-form" novalidate>

            <div class="modal-header">
              <h5 class="modal-title" id="edit-modal-title">Edit Expense</h5>
              <button type="button" class="btn-close" data-bs-dismiss="modal"
                aria-label="Close"></button>
            </div>

            <div class="modal-body">
              <div id="edit-alert" class="alert alert-danger d-none"
                role="alert"></div>

              <div class="mb-3">
                <label for="edit-title" class="form-label">Title</label>
                <input type="text" class="form-control" id="edit-title"
                  maxlength="100" required>
                <div class="invalid-feedback"></div>
              </div>

              <div class="mb-3">
                <label for="edit-amount" class="form-label">Amount</label>
                <input type="number" class="form-control" id="edit-amount"
                  step="0.01" min="0.01" required>
                <div class="invalid-feedback"></div>
              </div>

              <div class="mb-3">
                <label for="edit-category" class="form-label">Category</label>
                <select class="form-select" id="edit-category" required>
                  <option value="Food">Food</option>
                  <option value="Transport">Transport</option>
                  <option value="Bills">Bills</option>
                  <option value="Entertainment">Entertainment</option>
                  <option value="Other">Other</option>
                </select>
                <div class="invalid-feedback"></div>
              </div>

              <div class="mb-3">
                <label for="edit-date" class="form-label">Date</label>
                <input type="date" class="form-control" id="edit-date" required>
                <div class="invalid-feedback"></div>
              </div>
            </div>

            <div class="modal-footer">
              <button type="button" class="btn btn-secondary"
                data-bs-dismiss="modal">Cancel</button>
              <button type="submit" class="btn btn-primary">Save</button>
            </div>

          </form>
        </div>
      </div>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
